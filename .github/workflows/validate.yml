name: Validate skills

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r product-detail-page-pipeline/requirements.txt -r research-serp-keywords/requirements.txt
      - name: Check vendored runtime
        run: python3 shared/sync_vendored.py --check
      - name: Test gateway configuration
        run: python3 tests/test_ai_gateway.py
      - name: Test script-to-storyboard-video
        run: python3 script-to-storyboard-video/tests/test_smoke.py
      - name: Test product-to-ugc-video
        run: python3 product-to-ugc-video/tests/test_smoke.py
      - name: Test product-detail-page-pipeline
        run: python3 product-detail-page-pipeline/tests/test_smoke.py
      - name: Test research-serp-keywords
        run: python3 research-serp-keywords/tests/test_smoke.py
      - name: Test open-tiktok-script
        run: python3 open-tiktok-script/tests/test_smoke.py
      - name: Compile Python sources
        run: python3 -m compileall -q shared product-creative-scraper open-tiktok-script script-to-storyboard-video product-to-ugc-video product-detail-page-pipeline research-serp-keywords
