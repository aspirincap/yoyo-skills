<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { --ink:#172033; --muted:#65708a; --line:#dce3ef; --panel:#f7f9fc; --accent:#2457d6; --p1:#0d8a5f; --p2:#b87508; --p3:#b43b47; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:#eef2f8; }
    main { width:min(1180px, calc(100% - 32px)); margin:28px auto; background:white; border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 48px rgba(32,52,86,.09); overflow:hidden; }
    header { padding:28px 32px 22px; border-bottom:1px solid var(--line); background:linear-gradient(135deg,#f9fbff,#eef4ff); }
    h1 { margin:8px 0 4px; font-size:28px; letter-spacing:-.02em; }
    h2 { margin:0 0 14px; font-size:18px; }
    .eyebrow,.badge { display:inline-flex; align-items:center; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    .badge { padding:5px 10px; color:#1747b8; background:#dfe9ff; }
    .subtitle { color:var(--muted); max-width:850px; }
    .meta { display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; color:var(--muted); font-size:12px; }
    section { padding:24px 32px; border-bottom:1px solid var(--line); }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:12px; }
    .card { padding:16px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
    .card b { display:block; font-size:24px; line-height:1.2; margin-top:5px; }
    .card span { color:var(--muted); font-size:12px; }
    .notice { padding:14px 16px; border-left:4px solid var(--p2); background:#fff8e8; border-radius:8px; }
    table { width:100%; border-collapse:separate; border-spacing:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    th,td { padding:10px 11px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); }
    th { background:#f1f5fb; font-size:12px; color:#44506a; }
    tr:last-child td { border-bottom:0; }
    td.num { text-align:right; font-variant-numeric:tabular-nums; }
    .priority { display:inline-block; min-width:34px; padding:2px 7px; border-radius:999px; color:white; text-align:center; font-size:11px; font-weight:800; }
    .P1 { background:var(--p1); } .P2 { background:var(--p2); } .P3 { background:var(--p3); } .Unscored { background:#7b8499; }
    .clusters { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
    .cluster { border:1px solid var(--line); border-radius:12px; padding:14px; }
    .cluster h3 { font-size:14px; margin:0 0 7px; }
    .cluster p { margin:0; color:var(--muted); }
    code { background:#eef2f8; padding:2px 5px; border-radius:4px; }
    footer { padding:18px 32px; color:var(--muted); font-size:12px; }
    @media (max-width:720px) { main { width:100%; margin:0; border-radius:0; } header,section,footer { padding-left:18px; padding-right:18px; } .table-wrap { overflow:auto; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="badge">SERP-only</span>
      <h1>{{TITLE}}</h1>
      <div class="subtitle">{{SUBTITLE}}</div>
      <div class="meta">{{META}}</div>
    </header>
    <section>
      <div class="cards">{{KPI_CARDS}}</div>
    </section>
    <section>
      <div class="notice">{{LIMITATIONS}}</div>
    </section>
    <section>
      <h2>Top SERP opportunities</h2>
      <div class="table-wrap">{{TOP_TABLE}}</div>
    </section>
    <section>
      <h2>SERP-overlap clusters</h2>
      <div class="clusters">{{CLUSTERS}}</div>
    </section>
    <section>
      <h2>PAA &amp; related query ideas</h2>
      <div class="table-wrap">{{DISCOVERIES}}</div>
    </section>
    <section>
      <h2>Methodology & provenance</h2>
      {{METHODOLOGY}}
    </section>
    <footer>{{FOOTER}}</footer>
  </main>
</body>
</html>
